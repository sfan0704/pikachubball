name: Scheduled

# Weekly: read from the production database so the free Supabase project doesn't
# pause for inactivity, and keep a dump of its schema as an artifact. Neither
# calls Yahoo. Switched on by the repository variable RELEASE_AUTOMATION=true.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Keep the production database awake
    if: vars.RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read from the database
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/user_leagues?select=owner_id&limit=1"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  schema-dump:
    name: Dump the production schema
    if: vars.RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dump the schema
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db dump --linked --file schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Keep the dump
        uses: actions/upload-artifact@v4
        with:
          name: production-schema
          path: schema.sql
          retention-days: 90
