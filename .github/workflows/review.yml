name: Review environment

# The review environment (docs/target-state.md, "Review environment") for each
# pull request: the exact commit's build with a throwaway stack, synthetic
# managers and the Yahoo stand-in on this runner. No secrets: pull requests
# from forks get the same job with nothing to misuse.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Review environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Hosted configuration is refused
        run: |
          if SUPABASE_URL=https://example.supabase.co YAHOO_CLIENT_SECRET=x npm run review:start; then
            echo "review:start accepted hosted configuration" >&2
            exit 1
          fi

      - name: Start the review environment
        run: npm run review:start | tee review.json

      - name: Check it answers for this commit and signs in a synthetic manager
        run: |
          npm run review:status
          url=$(node -e 'const t=require("fs").readFileSync("review.json","utf8"); console.log(JSON.parse(t.slice(t.indexOf("{"))).url)')
          test "$(curl -s "$url/api/health" | node -pe 'JSON.parse(require("fs").readFileSync(0)).commit')" = "$(git rev-parse HEAD)"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/dev/login?user=a")" = "303"

      # First, so its empty report doesn't replace the real evidence below.
      - name: Evidence against the wrong commit is refused
        run: |
          if EXPECTED_COMMIT=0000000000000000000000000000000000000000 npm run review:evidence; then
            echo "review:evidence accepted a review at a different commit" >&2
            exit 1
          fi

      # Signed-in browser evidence for this exact commit: every main flow at phone
      # and desktop sizes, with accessibility checks, screenshots and browser errors.
      - name: Browser evidence for this commit
        id: evidence
        run: npm run review:evidence

      - name: Put the evidence summary on the run page
        if: always() && steps.evidence.outcome != 'skipped'
        run: cat .workspace/evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always() && steps.evidence.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ github.event.pull_request.head.sha || github.sha }}
          path: .workspace/evidence/
          # .workspace/ is a hidden folder, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stop it and check nothing is left
        if: always()
        run: |
          npm run review:stop
          npm run review:stop
          test "$(docker ps -q --filter "name=_$(node scripts/workspace.mts | node -pe 'JSON.parse(require("fs").readFileSync(0)).projectId')" | wc -l)" -eq 0
          test "$(ps -A -o command= | grep -c '[r]eview.mts expire')" -eq 0
