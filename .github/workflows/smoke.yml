name: Smoke check

# Runs against each production deployment once Vercel reports it successful, and
# fails (so notifies the owner through GitHub) when it is not healthy. Previews
# are not checked: they have no Supabase or Yahoo credentials by design.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke check
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Check the deployment
        id: deployment-smoke
        run: node scripts/smoke-check.mjs "${{ github.event.deployment_status.environment_url }}" "${{ github.event.deployment.sha }}"

      - name: Link the manual production rollback runbook
        if: ${{ failure() && steps.deployment-smoke.outcome == 'failure' }}
        run: bash scripts/smoke-failure-summary.sh
