name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The same contract people and agents run (scripts/validate.mts): lint,
      # format, knip, types, tests with coverage thresholds, build and bundle size.
      - name: Static checks, tests with coverage, build and bundle size
        run: npm run validate -- static unit build

  database:
    name: Database migrations & RLS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Disposable local Supabase stack only; no hosted project or secret.
      - name: Apply migrations and run pgTAP tests
        run: npm run validate -- database

      - name: Capture the migration-built schema reference
        run: npm run config:baseline -- .workspace/config-baseline.json

      - name: Keep the non-secret schema reference
        uses: actions/upload-artifact@v7
        with:
          name: config-baseline
          path: .workspace/config-baseline.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Builds, then runs the production build against the disposable local
      # Supabase stack and the Yahoo stand-in; no hosted project or secret.
      - name: Main flows at phone and desktop widths, with accessibility checks
        run: npm run validate -- browser

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
