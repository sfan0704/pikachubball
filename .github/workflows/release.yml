name: Release

# Started by hand (Run workflow) after the change has been tested on dev. The
# production environment makes each job wait for the owner's approval and only
# lets it run from main. Only one release runs at a time.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate the production database
    if: vars.RELEASE_AUTOMATION == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply the migrations
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  promote:
    name: Move production to the tested commit
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.PRODUCTION_DEPLOY_KEY }}

      # Only a fast-forward: production can never hold a commit main doesn't.
      - name: Fast-forward production
        run: git push origin "$GITHUB_SHA:refs/heads/production"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="v$(date -u +%Y.%-m)"
          count="$(git tag --list "$prefix.*" | wc -l | tr -d ' ')"
          tag="$prefix.$((count + 1))"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
