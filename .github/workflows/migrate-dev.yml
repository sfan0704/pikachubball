name: Migrate dev

# On every merge to main that changes the schema, apply the migrations to the dev
# database. Vercel deploys main to dev on its own. Switched on by the repository
# variable RELEASE_AUTOMATION=true once the `dev` environment holds its secrets
# (docs/runbooks/release.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]

concurrency:
  group: migrate-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate the dev database
    if: github.ref == 'refs/heads/main' && (vars.RELEASE_AUTOMATION == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A failed migration fails this job, which notifies the owner through GitHub.
      - name: Apply the migrations
        run: |
          test "$SUPABASE_PROJECT_REF" = "ocqdxmfpezxpgutoicyh"
          test -n "$SUPABASE_DB_PASSWORD"
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const password = encodeURIComponent(process.env.SUPABASE_DB_PASSWORD);
          const url = `postgresql://postgres.${process.env.SUPABASE_PROJECT_REF}:${password}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require`;
          console.log(`::add-mask::${password}`);
          console.log(`::add-mask::${url}`);
          const result = spawnSync('npx', ['supabase', 'db', 'push', '--db-url', url], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          JS
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
